name: Release container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag and package version agree
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; console.log(pkg.version)')"
          test "$TAG" = "v$VERSION"
      - id: source
        name: Record checked-out source revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/grey-harbor/drift
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/Grey-Harbor/drift
            org.opencontainers.image.licenses=MPL-2.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            REVISION=${{ steps.source.outputs.revision }}
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/grey-harbor/drift
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/grey-harbor/drift:${{ env.RELEASE_TAG }}`
            Digest: `${{ steps.build.outputs.digest }}`
            Platforms: `linux/amd64`, `linux/arm64`
